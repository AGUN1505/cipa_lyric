<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Merry Christmas, Please Don't Call — Bleachers · Lyric Visualizer</title>
  <meta name="description" content="A cinematic, audio-reactive lyric visualizer for Bleachers' “Merry Christmas, Please Don't Call” — synchronized lyrics, ASCII canvas, film grain and glitch." />
  <meta name="theme-color" content="#050505" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body data-section="intro" data-tone="cold" class="is-idle">

  <!-- SVG filter used for horizontal tear / displacement glitches on lyrics -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <filter id="tear" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence id="tear-noise" type="fractalNoise" baseFrequency="0.0008 0.22" numOctaves="1" seed="3" result="n" />
      <feDisplacementMap id="tear-map" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <main id="stage" class="stage">
    <h1 class="sr-only">Merry Christmas, Please Don't Call — Bleachers, lyric visualizer</h1>

    <canvas id="ascii-canvas" class="layer layer--ascii" aria-hidden="true"></canvas>
    <div class="layer layer--glow" aria-hidden="true"></div>
    <div id="ghosts" class="layer layer--ghosts" aria-hidden="true"></div>
    <section id="lyrics" class="layer layer--lyrics" aria-hidden="true"></section>
    <canvas id="fx-canvas" class="layer layer--fx" aria-hidden="true"></canvas>
    <div class="layer layer--vignette" aria-hidden="true"></div>
    <div class="layer layer--scan" aria-hidden="true"></div>

    <p id="lyric-live" class="sr-only" aria-live="polite"></p>

    <header class="hud hud--top" aria-label="Now playing">
      <div class="hud__meta">
        <span class="hud__artist">Bleachers</span>
        <span class="hud__sep">/</span>
        <span class="hud__title">Merry Christmas, Please Don't Call</span>
      </div>
      <div class="hud__right">
        <span id="hud-section" class="hud__section">intro</span>
        <span id="hud-tc" class="hud__tc">00:00.00</span>
      </div>
    </header>

    <!-- Intentional-interaction gate (browser autoplay policy) -->
    <div id="gate" class="gate">
      <div class="gate__inner">
        <p class="gate__kicker">bleachers</p>
        <p class="gate__title"><span>merry christmas,</span><span>please don't call</span></p>
        <button id="gate-btn" class="gate__btn" type="button">
          <span class="gate__dot" aria-hidden="true"></span> press to listen
        </button>
        <p class="gate__hint">headphones recommended · <kbd>space</kbd> play · <kbd>E</kbd> timeline editor</p>
      </div>
    </div>

    <nav id="controls" class="controls" aria-label="Player controls">
      <div class="controls__progress">
        <div id="progress-sections" class="controls__sections" aria-hidden="true"></div>
        <input id="seek" class="range range--seek" type="range" min="0" max="202" step="0.01" value="0" aria-label="Seek" />
      </div>
      <div class="controls__row">
        <button id="btn-play" class="ctl ctl--play" type="button" aria-label="Play" title="Play / pause (Space)">
          <svg viewBox="0 0 24 24" class="i-play"><path d="M7 5v14l12-7z" /></svg>
          <svg viewBox="0 0 24 24" class="i-pause"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" /></svg>
        </button>
        <span class="controls__time"><span id="t-cur">0:00</span><span class="controls__slash">/</span><span id="t-dur">0:00</span></span>

        <div class="controls__vol">
          <button id="btn-mute" class="ctl" type="button" aria-label="Mute" title="Mute (M)">
            <svg viewBox="0 0 24 24" class="i-vol"><path d="M4 9h4l5-4v14l-5-4H4z" /><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.6" /></svg>
            <svg viewBox="0 0 24 24" class="i-muted"><path d="M4 9h4l5-4v14l-5-4H4z" /><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="1.6" /></svg>
          </button>
          <input id="volume" class="range range--vol" type="range" min="0" max="1" step="0.01" value="0.9" aria-label="Volume" />
        </div>

        <span class="controls__spacer"></span>

        <button id="btn-ascii" class="ctl ctl--text is-on" type="button" aria-pressed="true" title="ASCII canvas (A)">ascii bg</button>
        <button id="btn-lyric-style" class="ctl ctl--text is-on" type="button" aria-pressed="true" title="Lyric ASCII style (L)">lyric: ascii</button>
        <button id="btn-color" class="ctl ctl--text" type="button" aria-pressed="false" title="ASCII colour mode (C)">mono</button>
        <button id="btn-fx" class="ctl ctl--text is-on" type="button" aria-pressed="true" title="Grain, glitch &amp; aberration (V)">fx</button>
        <button id="btn-editor" class="ctl ctl--text" type="button" aria-pressed="false" title="Timeline editor (E)">edit</button>
        <button id="btn-fs" class="ctl" type="button" aria-label="Fullscreen" title="Fullscreen (F)">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="1.6" /></svg>
        </button>
      </div>
    </nav>

    <div id="local-badge" class="local-badge" hidden>local timeline override</div>
  </main>

  <aside id="editor" class="editor" aria-label="Lyric timeline editor" hidden></aside>

  <audio id="audio" preload="auto"></audio>

  <script type="module" src="js/main.js"></script>
</body>
</html>
